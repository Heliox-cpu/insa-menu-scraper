name: Update INSA Lyon Menus & Calendar

on:
  schedule:
    # Tous les lundis à 05:00 UTC (07:00 heure de Paris)
    - cron: '0 5 * * 1'
    # Vérification de rattrapage le mardi et jeudi à 05:00 UTC
    - cron: '0 5 * * 2,4'
  workflow_dispatch: # Déclenchement manuel en 1 clic

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Scrape latest week and pre-cache dishes
        run: |
          python scripts/update_cache.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "INSA Menu Bot"
          git add data/cached_menu.json data/cached_dishes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update weekly menus, calendar & dish cache" && git pull --rebase && git push)

